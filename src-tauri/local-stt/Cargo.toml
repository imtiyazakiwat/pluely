[package]
name = "clocks-local-stt"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "On-device speech-to-text for Clocks: Silero VAD + streaming Zipformer (sherpa-onnx) + Smart Turn v3 end-of-turn detection."
publish = false

[dependencies]
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
# Downloads prebuilt static libraries (sherpa-onnx + ONNX Runtime) from the
# sherpa-onnx GitHub release at build time.
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["static"] }
# `alternative-backend` stops ort from linking a second ONNX Runtime. We hand it
# the ONNX Runtime that sherpa-onnx already links (see `ort_bridge.rs`). Only
# the v17 C API surface is compiled in, which every ONNX Runtime >= 1.17 has.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "alternative-backend", "api-17"] }
rustfft = "=6.4.1"

[dev-dependencies]
hound = "3.5.1"
libc = "0.2"
serde_json = "1"
