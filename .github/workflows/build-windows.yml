name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          key: windows-x64-crt-static

      - name: Install JS dependencies
        run: npm ci

      - name: Build app installer
        shell: bash
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: >-
          npx tauri build
          --bundles nsis
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pluely-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.9-release
          name: "Pluely v0.1.9"
          body: |
            ### Pluely Windows Release v0.1.9
            - Pre-configured default provider: SSS Pluely backend
            - Default model: `gemini-3.5-flash-lite`
            - Always on Top enabled by default (stays sticky over all windows)
            - Easy 1-click install for Windows (.exe)
          files: src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
